backend:
  name: git-gateway
  branch: main

# Médias (photos uploadées par l'admin)
media_folder: "img/uploads"
public_folder: "/img/uploads"

# Langue de l'interface admin
locale: 'fr'

# Configuration des collections (= ce que l'admin peut modifier)
collections:
  - name: "site"
    label: "Contenu du site"
    label_singular: "section"
    files:
      # ----------------------------------------
      # 1. HORAIRES DES CULTES
      # ----------------------------------------
      - name: "horaires"
        label: "1. Horaires des cultes"
        file: "contenu.json"
        fields:
          - { label: "Horaires des cultes", name: "horaires", widget: "object", fields: [
              { label: "Dimanche", name: "dimanche", widget: "object", fields: [
                { label: "Heure", name: "heure", widget: "string" },
                { label: "Nom du culte (FR)", name: "nom", widget: "string" },
                { label: "Nom du culte (NL)", name: "nom_nl", widget: "string" },
                { label: "Description (FR)", name: "description", widget: "text" },
                { label: "Description (NL)", name: "description_nl", widget: "text" }
              ]},
              { label: "Mercredi", name: "mercredi", widget: "object", fields: [
                { label: "Heure", name: "heure", widget: "string" },
                { label: "Nom du culte (FR)", name: "nom", widget: "string" },
                { label: "Nom du culte (NL)", name: "nom_nl", widget: "string" },
                { label: "Description (FR)", name: "description", widget: "text" },
                { label: "Description (NL)", name: "description_nl", widget: "text" }
              ]},
              { label: "Vendredi", name: "vendredi", widget: "object", fields: [
                { label: "Heure", name: "heure", widget: "string" },
                { label: "Nom du culte (FR)", name: "nom", widget: "string" },
                { label: "Nom du culte (NL)", name: "nom_nl", widget: "string" },
                { label: "Description (FR)", name: "description", widget: "text" },
                { label: "Description (NL)", name: "description_nl", widget: "text" }
              ]}
            ]}
          - { label: "Navette (ne pas toucher ici)", name: "navette", widget: "hidden" }
          - { label: "Equipe (ne pas toucher ici)", name: "equipe_pastorale", widget: "hidden" }
          - { label: "Departements (ne pas toucher ici)", name: "departements", widget: "hidden" }
          - { label: "Annonces (ne pas toucher ici)", name: "annonces", widget: "hidden" }
          - { label: "Guide (ne pas toucher)", name: "_GUIDE", widget: "hidden" }

      # ----------------------------------------
      # 2. NAVETTE
      # ----------------------------------------
      - name: "navette"
        label: "2. Navette gratuite"
        file: "contenu.json"
        fields:
          - { label: "Navette", name: "navette", widget: "object", fields: [
              { label: "Point de depart (FR)", name: "depart", widget: "string" },
              { label: "Point de depart (NL)", name: "depart_nl", widget: "string" },
              { label: "Point d'arrivee (FR)", name: "arrivee", widget: "string" },
              { label: "Point d'arrivee (NL)", name: "arrivee_nl", widget: "string" },
              { label: "Creneaux horaires", name: "creneaux", widget: "list", fields: [
                { label: "Jour (FR)", name: "jour", widget: "string" },
                { label: "Jour (NL)", name: "jour_nl", widget: "string" },
                { label: "Horaire (FR)", name: "horaire", widget: "string" },
                { label: "Horaire (NL)", name: "horaire_nl", widget: "string" },
                { label: "Description (FR)", name: "description", widget: "text" },
                { label: "Description (NL)", name: "description_nl", widget: "text" },
                { label: "Mettre en avant ?", name: "principal", widget: "boolean", default: false }
              ]}
            ]}
          - { label: "Horaires (ne pas toucher)", name: "horaires", widget: "hidden" }
          - { label: "Equipe (ne pas toucher)", name: "equipe_pastorale", widget: "hidden" }
          - { label: "Departements (ne pas toucher)", name: "departements", widget: "hidden" }
          - { label: "Annonces (ne pas toucher)", name: "annonces", widget: "hidden" }
          - { label: "Guide (ne pas toucher)", name: "_GUIDE", widget: "hidden" }

      # ----------------------------------------
      # 3. EQUIPE PASTORALE
      # ----------------------------------------
      - name: "equipe"
        label: "3. Equipe pastorale"
        file: "contenu.json"
        fields:
          - { label: "Equipe pastorale", name: "equipe_pastorale", widget: "object", fields: [
              { label: "Membres", name: "membres", widget: "list", fields: [
                { label: "Initiales (2 lettres ex GK)", name: "initiales", widget: "string" },
                { label: "Nom complet", name: "nom", widget: "string" },
                { label: "Role (FR)", name: "role", widget: "string" },
                { label: "Role (NL)", name: "role_nl", widget: "string" }
              ]}
            ]}
          - { label: "Horaires (ne pas toucher)", name: "horaires", widget: "hidden" }
          - { label: "Navette (ne pas toucher)", name: "navette", widget: "hidden" }
          - { label: "Departements (ne pas toucher)", name: "departements", widget: "hidden" }
          - { label: "Annonces (ne pas toucher)", name: "annonces", widget: "hidden" }
          - { label: "Guide (ne pas toucher)", name: "_GUIDE", widget: "hidden" }

      # ----------------------------------------
      # 4. DEPARTEMENTS
      # ----------------------------------------
      - name: "departements"
        label: "4. Departements"
        file: "contenu.json"
        fields:
          - { label: "Departements", name: "departements", widget: "object", fields: [
              { label: "Liste des departements", name: "liste", widget: "list", fields: [
                { label: "Identifiant (ne pas changer)", name: "id", widget: "string" },
                { label: "Nom (FR)", name: "nom", widget: "string" },
                { label: "Nom (NL)", name: "nom_nl", widget: "string" },
                { label: "Description (FR)", name: "description", widget: "text" },
                { label: "Description (NL)", name: "description_nl", widget: "text" },
                { label: "Photo (nom du fichier dans img/dept/)", name: "photo", widget: "string", required: false }
              ]}
            ]}
          - { label: "Horaires (ne pas toucher)", name: "horaires", widget: "hidden" }
          - { label: "Navette (ne pas toucher)", name: "navette", widget: "hidden" }
          - { label: "Equipe (ne pas toucher)", name: "equipe_pastorale", widget: "hidden" }
          - { label: "Annonces (ne pas toucher)", name: "annonces", widget: "hidden" }
          - { label: "Guide (ne pas toucher)", name: "_GUIDE", widget: "hidden" }

      # ----------------------------------------
      # 5. ANNONCES
      # ----------------------------------------
      - name: "annonces"
        label: "5. Annonces et evenements"
        file: "contenu.json"
        fields:
          - { label: "Annonces", name: "annonces", widget: "object", fields: [
              { label: "Liste des annonces", name: "liste", widget: "list", fields: [
                { label: "Titre (FR)", name: "titre", widget: "string" },
                { label: "Titre (NL)", name: "titre_nl", widget: "string" },
                { label: "Date (FR)", name: "date", widget: "string", hint: "Ex: Dimanche 14 juin 2026" },
                { label: "Date (NL)", name: "date_nl", widget: "string" },
                { label: "Description (FR)", name: "description", widget: "text" },
                { label: "Description (NL)", name: "description_nl", widget: "text" },
                { label: "Mettre en avant (carte bleu nuit) ?", name: "important", widget: "boolean", default: false }
              ]}
            ]}
          - { label: "Horaires (ne pas toucher)", name: "horaires", widget: "hidden" }
          - { label: "Navette (ne pas toucher)", name: "navette", widget: "hidden" }
          - { label: "Equipe (ne pas toucher)", name: "equipe_pastorale", widget: "hidden" }
          - { label: "Departements (ne pas toucher)", name: "departements", widget: "hidden" }
          - { label: "Guide (ne pas toucher)", name: "_GUIDE", widget: "hidden" }
