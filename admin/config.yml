backend:
  name: git-gateway
  branch: main

# Médias (photos uploadées par l'admin)
media_folder: "img/uploads"
public_folder: "/img/uploads"

# Langue de l'interface admin
locale: 'fr'

collections:

  # ========================================
  # 1. ANNONCES ET EVENEMENTS  (le + utilisé)
  # ========================================
  - name: "annonces"
    label: "📢 Annonces et événements"
    label_singular: "annonces"
    files:
      - name: "annonces_data"
        label: "Annonces"
        file: "contenu.json"
        fields:
          - label: "Annonces et evenements"
            name: "annonces"
            widget: "object"
            fields:
              - label: "Liste des annonces"
                name: "liste"
                widget: "list"
                hint: "Ajoutez, modifiez ou supprimez des annonces. Les annonces importantes s'affichent en bleu nuit."
                fields:
                  - label: "Photo illustrative (optionnel)"
                    name: "image"
                    widget: "image"
                    required: false
                    hint: "Image affichée en haut de la carte d'annonce. Taille recommandée : 800×400px."
                  - { label: "Titre (FR)", name: "titre", widget: "string" }
                  - { label: "Titre (NL)", name: "titre_nl", widget: "string", required: false }
                  - { label: "Titre (EN)", name: "titre_en", widget: "string", required: false }
                  - { label: "Date (FR) — ex: Dimanche 14 juin 2026", name: "date", widget: "string" }
                  - { label: "Date (NL)", name: "date_nl", widget: "string", required: false }
                  - { label: "Date (EN)", name: "date_en", widget: "string", required: false }
                  - { label: "Description (FR)", name: "description", widget: "text" }
                  - { label: "Description (NL)", name: "description_nl", widget: "text", required: false }
                  - { label: "Description (EN)", name: "description_en", widget: "text", required: false }
                  - { label: "Mettre en avant ? (fond bleu nuit)", name: "important", widget: "boolean", default: false }
          - { label: "_", name: "hero", widget: "hidden" }
          - { label: "_", name: "banniere", widget: "hidden" }
          - { label: "_", name: "horaires", widget: "hidden" }
          - { label: "_", name: "navette", widget: "hidden" }
          - { label: "_", name: "equipe_pastorale", widget: "hidden" }
          - { label: "_", name: "departements", widget: "hidden" }
          - { label: "_", name: "photos_culte", widget: "hidden" }
          - { label: "_", name: "temoignages", widget: "hidden" }
          - { label: "_", name: "message_pasteur", widget: "hidden" }
          - { label: "_", name: "infos", widget: "hidden" }
          - { label: "_", name: "footer", widget: "hidden" }
          - { label: "_", name: "vision_mission", widget: "hidden" }
          - { label: "_", name: "jefc", widget: "hidden" }
          - { label: "_", name: "seo", widget: "hidden" }
          - { label: "_", name: "_GUIDE", widget: "hidden" }

  # ========================================
  # 2. BANNIERE EN HAUT DU SITE
  # ========================================
  - name: "banniere"
    label: "🔔 Bannière d'annonce"
    label_singular: "banniere"
    files:
      - name: "banniere_data"
        label: "Bannière"
        file: "contenu.json"
        fields:
          - label: "Banniere en haut du site"
            name: "banniere"
            widget: "object"
            hint: "La bannière s'affiche tout en haut du site. Activez-la pour les annonces urgentes."
            fields:
              - { label: "Afficher la banniere ?", name: "active", widget: "boolean", default: false }
              - { label: "Texte de la banniere (FR)", name: "texte", widget: "string", required: false, hint: "Ex: Grande celebration le 14 juin — Tous invites !" }
              - { label: "Texte de la banniere (NL)", name: "texte_nl", widget: "string", required: false }
              - { label: "Texte de la banniere (EN)", name: "texte_en", widget: "string", required: false }
              - { label: "Lien (optionnel)", name: "lien", widget: "string", required: false, hint: "Ex: #annonces ou une URL externe" }
              - { label: "Texte du lien (FR)", name: "lien_texte", widget: "string", required: false, hint: "Ex: En savoir plus" }
              - { label: "Texte du lien (NL)", name: "lien_texte_nl", widget: "string", required: false }
              - { label: "Texte du lien (EN)", name: "lien_texte_en", widget: "string", required: false }
          - { label: "_", name: "hero", widget: "hidden" }
          - { label: "_", name: "horaires", widget: "hidden" }
          - { label: "_", name: "navette", widget: "hidden" }
          - { label: "_", name: "equipe_pastorale", widget: "hidden" }
          - { label: "_", name: "departements", widget: "hidden" }
          - { label: "_", name: "photos_culte", widget: "hidden" }
          - { label: "_", name: "annonces", widget: "hidden" }
          - { label: "_", name: "temoignages", widget: "hidden" }
          - { label: "_", name: "message_pasteur", widget: "hidden" }
          - { label: "_", name: "infos", widget: "hidden" }
          - { label: "_", name: "footer", widget: "hidden" }
          - { label: "_", name: "vision_mission", widget: "hidden" }
          - { label: "_", name: "jefc", widget: "hidden" }
          - { label: "_", name: "seo", widget: "hidden" }
          - { label: "_", name: "_GUIDE", widget: "hidden" }

  # ========================================
  # 3. MESSAGE DU PASTEUR
  # ========================================
  - name: "message_pasteur"
    label: "✉️ Message du Pasteur"
    label_singular: "message"
    files:
      - name: "message_data"
        label: "Message du Pasteur"
        file: "contenu.json"
        fields:
          - label: "Message du Pasteur"
            name: "message_pasteur"
            widget: "object"
            hint: "Affiche un encart avec un message du pasteur sur le site. Activez-le pour le rendre visible."
            fields:
              - { label: "Afficher le message ?", name: "actif", widget: "boolean", default: false }
              - { label: "Nom de l'auteur", name: "auteur", widget: "string", default: "Pasteur Guy KOBI" }
              - { label: "Titre du message", name: "titre", widget: "string", default: "Un message du pasteur" }
              - { label: "Message (FR)", name: "message", widget: "text", required: false, hint: "Le message s'affichera en citation sur le site" }
              - { label: "Message (NL)", name: "message_nl", widget: "text", required: false }
              - { label: "Message (EN)", name: "message_en", widget: "text", required: false }
          - { label: "_", name: "hero", widget: "hidden" }
          - { label: "_", name: "banniere", widget: "hidden" }
          - { label: "_", name: "horaires", widget: "hidden" }
          - { label: "_", name: "navette", widget: "hidden" }
          - { label: "_", name: "equipe_pastorale", widget: "hidden" }
          - { label: "_", name: "departements", widget: "hidden" }
          - { label: "_", name: "photos_culte", widget: "hidden" }
          - { label: "_", name: "annonces", widget: "hidden" }
          - { label: "_", name: "temoignages", widget: "hidden" }
          - { label: "_", name: "infos", widget: "hidden" }
          - { label: "_", name: "footer", widget: "hidden" }
          - { label: "_", name: "vision_mission", widget: "hidden" }
          - { label: "_", name: "jefc", widget: "hidden" }
          - { label: "_", name: "seo", widget: "hidden" }
          - { label: "_", name: "_GUIDE", widget: "hidden" }

  # ========================================
  # 4. PHOTOS DU CULTE (GALERIE)
  # ========================================
  - name: "photos_culte"
    label: "📸 Photos du culte"
    files:
      - name: "photos_data"
        label: "Galerie photos"
        file: "photos_culte.json"
        description: >
          COMMENT AJOUTER PLUSIEURS PHOTOS EN UNE FOIS :
          Utilisez le bouton flottant "📸 Upload photos" en bas à droite —
          il permet de glisser-déposer toutes vos photos en une seule opération.
        fields:
          - label: "Photos du culte"
            name: "photos"
            widget: "list"
            minimize_collapsed: true
            collapsed: false
            hint: >
              ➕ Astuce : utilisez le bouton flottant "📸 Upload photos" pour uploader toutes vos photos
              en même temps. Elles apparaîtront automatiquement dans la galerie.
            field:
              label: "Photo"
              name: "url"
              widget: "image"
              hint: "Cliquez pour choisir une photo déjà uploadée ou en uploader une nouvelle"

  # ========================================
  # 5. HORAIRES DES CULTES
  # ========================================
  - name: "horaires"
    label: "🕐 Horaires des cultes"
    label_singular: "horaires"
    files:
      - name: "horaires_data"
        label: "Horaires"
        file: "contenu.json"
        fields:
          - label: "Horaires des cultes"
            name: "horaires"
            widget: "object"
            fields:
              - label: "Culte du dimanche"
                name: "dimanche"
                widget: "object"
                fields:
                  - { label: "Heure (ex: 10h00)", name: "heure", widget: "string" }
                  - { label: "Nom du culte (FR)", name: "nom", widget: "string" }
                  - { label: "Nom du culte (NL)", name: "nom_nl", widget: "string" }
                  - { label: "Nom du culte (EN)", name: "nom_en", widget: "string", required: false }
                  - { label: "Description (FR)", name: "description", widget: "text" }
                  - { label: "Description (NL)", name: "description_nl", widget: "text" }
                  - { label: "Description (EN)", name: "description_en", widget: "text", required: false }
              - label: "Etude biblique du mercredi"
                name: "mercredi"
                widget: "object"
                fields:
                  - { label: "Heure (ex: 18h00)", name: "heure", widget: "string" }
                  - { label: "Nom du culte (FR)", name: "nom", widget: "string" }
                  - { label: "Nom du culte (NL)", name: "nom_nl", widget: "string" }
                  - { label: "Nom du culte (EN)", name: "nom_en", widget: "string", required: false }
                  - { label: "Description (FR)", name: "description", widget: "text" }
                  - { label: "Description (NL)", name: "description_nl", widget: "text" }
                  - { label: "Description (EN)", name: "description_en", widget: "text", required: false }
              - label: "Jeune & Priere du vendredi"
                name: "vendredi"
                widget: "object"
                fields:
                  - { label: "Heure (ex: 18h00-20h00)", name: "heure", widget: "string" }
                  - { label: "Nom du culte (FR)", name: "nom", widget: "string" }
                  - { label: "Nom du culte (NL)", name: "nom_nl", widget: "string" }
                  - { label: "Nom du culte (EN)", name: "nom_en", widget: "string", required: false }
                  - { label: "Description (FR)", name: "description", widget: "text" }
                  - { label: "Description (NL)", name: "description_nl", widget: "text" }
                  - { label: "Description (EN)", name: "description_en", widget: "text", required: false }
          - { label: "_", name: "hero", widget: "hidden" }
          - { label: "_", name: "banniere", widget: "hidden" }
          - { label: "_", name: "navette", widget: "hidden" }
          - { label: "_", name: "equipe_pastorale", widget: "hidden" }
          - { label: "_", name: "departements", widget: "hidden" }
          - { label: "_", name: "photos_culte", widget: "hidden" }
          - { label: "_", name: "annonces", widget: "hidden" }
          - { label: "_", name: "temoignages", widget: "hidden" }
          - { label: "_", name: "message_pasteur", widget: "hidden" }
          - { label: "_", name: "infos", widget: "hidden" }
          - { label: "_", name: "footer", widget: "hidden" }
          - { label: "_", name: "vision_mission", widget: "hidden" }
          - { label: "_", name: "jefc", widget: "hidden" }
          - { label: "_", name: "seo", widget: "hidden" }
          - { label: "_", name: "_GUIDE", widget: "hidden" }

  # ========================================
  # 6. JEFC — JEUNESSE
  # ========================================
  - name: "jefc"
    label: "✝ JEFC — Jeunesse"
    files:
      - name: "jefc_data"
        label: "Section Jeunesse (JEFC)"
        file: "contenu.json"
        fields:
          - label: "Section JEFC"
            name: "jefc"
            widget: "object"
            hint: "Section 'Jeunesse' visible sur le site. Modifiez le titre, le texte et la fréquence."
            fields:
              - { label: "Etiquette fréquence (FR)", name: "tag", widget: "string", hint: "Ex: Toutes les 2 semaines", default: "Toutes les 2 semaines" }
              - { label: "Etiquette fréquence (NL)", name: "tag_nl", widget: "string", required: false, hint: "Ex: Om de 2 weken" }
              - { label: "Etiquette fréquence (EN)", name: "tag_en", widget: "string", required: false, hint: "Ex: Every 2 weeks" }
              - { label: "Titre (FR)", name: "titre", widget: "string", hint: "Ex: Un espace de foi, de croissance et de fraternité." }
              - { label: "Titre (NL)", name: "titre_nl", widget: "string", required: false }
              - { label: "Titre (EN)", name: "titre_en", widget: "string", required: false }
              - { label: "Texte de présentation (FR)", name: "texte", widget: "text" }
              - { label: "Texte de présentation (NL)", name: "texte_nl", widget: "text", required: false }
              - { label: "Texte de présentation (EN)", name: "texte_en", widget: "text", required: false }
              - { label: "Fréquence — valeur (FR)", name: "frequence", widget: "string", hint: "Ex: Toutes les 2 semaines" }
              - { label: "Fréquence — valeur (NL)", name: "frequence_nl", widget: "string", required: false }
              - { label: "Fréquence — valeur (EN)", name: "frequence_en", widget: "string", required: false }
              - { label: "Lieu", name: "lieu", widget: "string", hint: "Ex: Wijngaardveld 29" }
          - { label: "_", name: "hero", widget: "hidden" }
          - { label: "_", name: "banniere", widget: "hidden" }
          - { label: "_", name: "horaires", widget: "hidden" }
          - { label: "_", name: "navette", widget: "hidden" }
          - { label: "_", name: "equipe_pastorale", widget: "hidden" }
          - { label: "_", name: "departements", widget: "hidden" }
          - { label: "_", name: "photos_culte", widget: "hidden" }
          - { label: "_", name: "annonces", widget: "hidden" }
          - { label: "_", name: "temoignages", widget: "hidden" }
          - { label: "_", name: "message_pasteur", widget: "hidden" }
          - { label: "_", name: "infos", widget: "hidden" }
          - { label: "_", name: "footer", widget: "hidden" }
          - { label: "_", name: "vision_mission", widget: "hidden" }
          - { label: "_", name: "seo", widget: "hidden" }
          - { label: "_", name: "_GUIDE", widget: "hidden" }

  # ========================================
  # 7. TEMOIGNAGES
  # ========================================
  - name: "temoignages"
    label: "💬 Témoignages"
    label_singular: "temoignages"
    files:
      - name: "temoignages_data"
        label: "Temoignages"
        file: "contenu.json"
        fields:
          - label: "Temoignages de membres"
            name: "temoignages"
            widget: "object"
            hint: "Activez pour afficher une section de temoignages sur le site."
            fields:
              - { label: "Afficher les temoignages ?", name: "actif", widget: "boolean", default: false }
              - label: "Liste des temoignages"
                name: "liste"
                widget: "list"
                fields:
                  - { label: "Prenom", name: "prenom", widget: "string" }
                  - { label: "Initiales (2 lettres, ex: MK)", name: "initiales", widget: "string" }
                  - { label: "Role / Anciennete", name: "role", widget: "string", required: false, hint: "Ex: Membre depuis 3 ans" }
                  - { label: "Temoignage (FR)", name: "texte", widget: "text" }
                  - { label: "Temoignage (NL)", name: "texte_nl", widget: "text", required: false }
                  - { label: "Temoignage (EN)", name: "texte_en", widget: "text", required: false }
          - { label: "_", name: "hero", widget: "hidden" }
          - { label: "_", name: "banniere", widget: "hidden" }
          - { label: "_", name: "horaires", widget: "hidden" }
          - { label: "_", name: "navette", widget: "hidden" }
          - { label: "_", name: "equipe_pastorale", widget: "hidden" }
          - { label: "_", name: "departements", widget: "hidden" }
          - { label: "_", name: "photos_culte", widget: "hidden" }
          - { label: "_", name: "annonces", widget: "hidden" }
          - { label: "_", name: "message_pasteur", widget: "hidden" }
          - { label: "_", name: "infos", widget: "hidden" }
          - { label: "_", name: "footer", widget: "hidden" }
          - { label: "_", name: "vision_mission", widget: "hidden" }
          - { label: "_", name: "jefc", widget: "hidden" }
          - { label: "_", name: "seo", widget: "hidden" }
          - { label: "_", name: "_GUIDE", widget: "hidden" }

  # ========================================
  # 8. VISION & MISSION
  # ========================================
  - name: "vision_mission"
    label: "✝ Vision & Mission"
    files:
      - name: "vision_mission_data"
        label: "Vision & Mission"
        file: "contenu.json"
        fields:
          - label: "Vision & Mission"
            name: "vision_mission"
            widget: "object"
            hint: "Section 'Qui sommes-nous' visible sur le site. Activez-la pour la rendre visible."
            fields:
              - { label: "Afficher la section ?", name: "actif", widget: "boolean", default: true }
              - { label: "Surtitre (FR) — ex: Qui sommes-nous", name: "eyebrow", widget: "string" }
              - { label: "Surtitre (NL)", name: "eyebrow_nl", widget: "string", required: false }
              - { label: "Surtitre (EN)", name: "eyebrow_en", widget: "string", required: false }
              - { label: "Titre de la section (FR)", name: "titre", widget: "string" }
              - { label: "Titre de la section (NL)", name: "titre_nl", widget: "string", required: false }
              - { label: "Titre de la section (EN)", name: "titre_en", widget: "string", required: false }
              - { label: "Texte d'introduction (FR)", name: "intro", widget: "text", hint: "Courte présentation de l'église pour les nouveaux visiteurs." }
              - { label: "Texte d'introduction (NL)", name: "intro_nl", widget: "text", required: false }
              - { label: "Texte d'introduction (EN)", name: "intro_en", widget: "text", required: false }
              - { label: "Titre Vision (FR)", name: "vision_titre", widget: "string", default: "Notre Vision" }
              - { label: "Titre Vision (NL)", name: "vision_titre_nl", widget: "string", required: false }
              - { label: "Titre Vision (EN)", name: "vision_titre_en", widget: "string", required: false }
              - { label: "Texte Vision (FR)", name: "vision_texte", widget: "text" }
              - { label: "Texte Vision (NL)", name: "vision_texte_nl", widget: "text", required: false }
              - { label: "Texte Vision (EN)", name: "vision_texte_en", widget: "text", required: false }
              - { label: "Titre Mission (FR)", name: "mission_titre", widget: "string", default: "Notre Mission" }
              - { label: "Titre Mission (NL)", name: "mission_titre_nl", widget: "string", required: false }
              - { label: "Titre Mission (EN)", name: "mission_titre_en", widget: "string", required: false }
              - { label: "Texte Mission (FR)", name: "mission_texte", widget: "text" }
              - { label: "Texte Mission (NL)", name: "mission_texte_nl", widget: "text", required: false }
              - { label: "Texte Mission (EN)", name: "mission_texte_en", widget: "text", required: false }
              - label: "Valeurs (4 maximum)"
                name: "valeurs"
                widget: "list"
                max: 4
                fields:
                  - label: "Icône"
                    name: "icone"
                    widget: "select"
                    hint: "Choisissez l'icône qui correspond à cette valeur"
                    options:
                      - { label: "📖 La Parole", value: "parole" }
                      - { label: "🙏 La Prière", value: "priere" }
                      - { label: "👨‍👩‍👧 La Famille", value: "famille" }
                      - { label: "✝️ L'Évangélisation", value: "evangelisation" }
                  - { label: "Titre de la valeur (FR)", name: "titre", widget: "string" }
                  - { label: "Titre de la valeur (NL)", name: "titre_nl", widget: "string", required: false }
                  - { label: "Titre de la valeur (EN)", name: "titre_en", widget: "string", required: false }
                  - { label: "Description courte (FR)", name: "texte", widget: "text" }
                  - { label: "Description courte (NL)", name: "texte_nl", widget: "text", required: false }
                  - { label: "Description courte (EN)", name: "texte_en", widget: "text", required: false }
              - { label: "Verset biblique (FR)", name: "verset_texte", widget: "string" }
              - { label: "Verset biblique (NL)", name: "verset_texte_nl", widget: "string", required: false }
              - { label: "Verset biblique (EN)", name: "verset_texte_en", widget: "string", required: false }
              - { label: "Référence du verset (FR)", name: "verset_reference", widget: "string" }
              - { label: "Référence du verset (NL)", name: "verset_reference_nl", widget: "string", required: false }
              - { label: "Référence du verset (EN)", name: "verset_reference_en", widget: "string", required: false }
          - { label: "_", name: "hero", widget: "hidden" }
          - { label: "_", name: "banniere", widget: "hidden" }
          - { label: "_", name: "horaires", widget: "hidden" }
          - { label: "_", name: "navette", widget: "hidden" }
          - { label: "_", name: "equipe_pastorale", widget: "hidden" }
          - { label: "_", name: "departements", widget: "hidden" }
          - { label: "_", name: "photos_culte", widget: "hidden" }
          - { label: "_", name: "annonces", widget: "hidden" }
          - { label: "_", name: "temoignages", widget: "hidden" }
          - { label: "_", name: "message_pasteur", widget: "hidden" }
          - { label: "_", name: "infos", widget: "hidden" }
          - { label: "_", name: "footer", widget: "hidden" }
          - { label: "_", name: "jefc", widget: "hidden" }
          - { label: "_", name: "seo", widget: "hidden" }
          - { label: "_", name: "_GUIDE", widget: "hidden" }

  # ========================================
  # 9. NAVETTE GRATUITE
  # ========================================
  - name: "navette"
    label: "🚌 Navette gratuite"
    label_singular: "navette"
    files:
      - name: "navette_data"
        label: "Navette"
        file: "contenu.json"
        fields:
          - label: "Navette"
            name: "navette"
            widget: "object"
            fields:
              - { label: "Point de depart (FR)", name: "depart", widget: "string" }
              - { label: "Point de depart (NL)", name: "depart_nl", widget: "string" }
              - { label: "Point de depart (EN)", name: "depart_en", widget: "string", required: false }
              - { label: "Point d'arrivee (FR)", name: "arrivee", widget: "string" }
              - { label: "Point d'arrivee (NL)", name: "arrivee_nl", widget: "string" }
              - { label: "Point d'arrivee (EN)", name: "arrivee_en", widget: "string", required: false }
              - label: "Creneaux horaires"
                name: "creneaux"
                widget: "list"
                fields:
                  - { label: "Jour (FR)", name: "jour", widget: "string" }
                  - { label: "Jour (NL)", name: "jour_nl", widget: "string" }
                  - { label: "Jour (EN)", name: "jour_en", widget: "string", required: false }
                  - { label: "Horaire (FR)", name: "horaire", widget: "string" }
                  - { label: "Horaire (NL)", name: "horaire_nl", widget: "string" }
                  - { label: "Description (FR)", name: "description", widget: "text" }
                  - { label: "Description (NL)", name: "description_nl", widget: "text" }
                  - { label: "Description (EN)", name: "description_en", widget: "text", required: false }
