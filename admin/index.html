<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · CEFC Alost</title>
  <link rel="icon" type="image/png" href="../cefc-logo.png" />
  <!-- Decap CMS (anciennement Netlify CMS) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Raccourcis rapides (visibles après connexion) -->
  <div id="uploadShortcut" style="display:none;position:fixed;bottom:24px;right:24px;z-index:9999;display:none;flex-direction:column;gap:10px;align-items:flex-end">
    <a href="/admin/dashboard.html"
       style="display:inline-flex;align-items:center;gap:8px;background:#1a1f35;color:#e2e8f0;padding:10px 18px;border-radius:12px;text-decoration:none;font-family:sans-serif;font-weight:600;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,0.4);border:1px solid #252b42">
      🏠 Tableau de bord
    </a>
    <a href="/admin/upload.html"
       style="display:inline-flex;align-items:center;gap:8px;background:#7c3aed;color:white;padding:10px 18px;border-radius:12px;text-decoration:none;font-family:sans-serif;font-weight:600;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,0.4)">
      📸 Upload photos (multi)
    </a>
  </div>
  <!-- Le CMS s'injecte ici -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Si l'utilisateur n'est pas connecté à Netlify Identity, on le redirige automatiquement
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        } else {
          document.getElementById('uploadShortcut').style.display = 'block';
        }
      });
      window.netlifyIdentity.on("login", () => {
        document.getElementById('uploadShortcut').style.display = 'block';
      });
    }
  </script>
</body>
</html>
